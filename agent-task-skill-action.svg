<svg xmlns="http://www.w3.org/2000/svg" width="700" height="340" viewBox="0 0 700 340" role="img" aria-labelledby="title description">
  <title id="title">Agent, Task, Skill and Action relationships</title>
  <desc id="description">An Agent manages a Task and loads Skills. A Task preserves a goal and context and combines Skills. Skills provide instructions and expose callable Actions. The Agent invokes Actions through Gateway and observes actual results to inform its next decision. Skills can also be loaded without a Task.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="700" height="340" rx="16" fill="#ffffff"/>
  <g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)">
    <path d="M 172 126 L 254 69"/>
    <path d="M 172 164 L 254 225"/>
    <path d="M 342 114 L 342 180"/>
    <path d="M 430 225 L 520 225"/>
    <path d="M 598 270 V 310 H 98 V 195" stroke-dasharray="5 5"/>
  </g>
  <g stroke-width="1.5">
    <rect x="24" y="95" width="148" height="100" rx="20" fill="#ede9fe" stroke="#a397c6"/>
    <rect x="254" y="24" width="176" height="90" rx="20" fill="#e0f2fe" stroke="#7ba6c4"/>
    <rect x="254" y="180" width="176" height="90" rx="20" fill="#dcfce7" stroke="#80af94"/>
    <rect x="520" y="180" width="156" height="90" rx="20" fill="#ffedd5" stroke="#c7a17b"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle" dominant-baseline="middle">
    <g fill="#1e293b" font-size="20" font-weight="600">
      <text x="98" y="132">Agent</text>
      <text x="342" y="57">Task</text>
      <text x="342" y="213">Skill</text>
      <text x="598" y="213">Action</text>
    </g>
    <g fill="#475569" font-size="13">
      <text x="98" y="158">Reason + converse</text>
      <text x="342" y="83">Goal + context</text>
      <text x="342" y="239">Instructions + functions</text>
      <text x="598" y="239">Execute via Gateway</text>
    </g>
    <g fill="#475569" font-size="14">
      <text x="202" y="80">manages</text>
      <text x="204" y="213">loads</text>
      <text x="354" y="147" text-anchor="start">combines</text>
      <text x="475" y="208">exposes</text>
      <text x="348" y="294">Results inform the next decision</text>
    </g>
  </g>
</svg>
