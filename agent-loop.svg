<svg xmlns="http://www.w3.org/2000/svg" width="640" height="350" viewBox="0 0 640 350" role="img" aria-labelledby="title description">
  <title id="title">Perception → Cognition → Action feedback loop</title>
  <desc id="description">Perception, Cognition and Action form a counterclockwise triangular loop. Each solid connecting arrow carries an Internal Signal. A dashed External Signal arrow enters Perception from outside the loop.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="640" height="350" rx="16" fill="#ffffff"/>
  <g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)">
    <path d="M 320 24 V 86" stroke-dasharray="5 5"/>
    <path d="M 262 138 L 160 266"/>
    <path d="M 214 292 H 426"/>
    <path d="M 480 266 L 378 138"/>
  </g>
  <g stroke-width="1.5">
    <rect x="244" y="86" width="152" height="52" rx="26" fill="#e0f2fe" stroke="#7ba6c4"/>
    <rect x="62" y="266" width="152" height="52" rx="26" fill="#ede9fe" stroke="#a397c6"/>
    <rect x="426" y="266" width="152" height="52" rx="26" fill="#ffedd5" stroke="#c7a17b"/>
  </g>
  <g fill="#ffffff">
    <rect x="152" y="188" width="118" height="26" rx="8"/>
    <rect x="370" y="188" width="118" height="26" rx="8"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle" dominant-baseline="middle">
    <g fill="#1e293b" font-size="19" font-weight="600">
      <text x="320" y="112">Perception</text>
      <text x="138" y="292">Cognition</text>
      <text x="502" y="292">Action</text>
    </g>
    <g fill="#475569" font-size="14">
      <text x="338" y="51" text-anchor="start">External Signal</text>
      <text x="211" y="201">Internal Signal</text>
      <text x="429" y="201">Internal Signal</text>
      <text x="320" y="274">Internal Signal</text>
    </g>
  </g>
</svg>
