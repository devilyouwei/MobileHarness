<svg xmlns="http://www.w3.org/2000/svg" width="420" height="250" viewBox="0 0 420 250" role="img" aria-labelledby="title">
  <title id="title">Signal → Cognition → Action → Signal, counterclockwise</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)">
    <path d="M 175 72 L 104 170"/>
    <path d="M 150 200 L 270 200"/>
    <path d="M 316 170 L 245 72"/>
  </g>
  <g fill="#f8fafc" stroke="#64748b" stroke-width="1.5">
    <rect x="150" y="24" width="120" height="48" rx="24"/>
    <rect x="20" y="176" width="130" height="48" rx="24"/>
    <rect x="270" y="176" width="130" height="48" rx="24"/>
  </g>
  <g fill="#1e293b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="17" text-anchor="middle" dominant-baseline="middle">
    <text x="210" y="48">Signal</text>
    <text x="85" y="200">Cognition</text>
    <text x="335" y="200">Action</text>
  </g>
</svg>
